/* ================================================================
   HAPKIDO LAYER — catalogue, safety, readiness, milestones
   ----------------------------------------------------------------
   Everything below either ADDS hapkido-specific machinery or
   OVERRIDES a Hanbit function by redeclaring it (function
   declarations later in the file win). The FSRS scheduler, FX,
   mascot, storage, and session engine above are untouched.
   ================================================================ */

const DAY = 86400000;
const STORE_KEY = 'lmaa-hapkido.v1';

/* ---------- courses: two separate schools of study ----------------
   Data-driven from CURRICULUM.courses. A course is to this app what a
   language is to a language app: its own path, its own daily budget,
   its own colour, its own celebrations. The belt is shared, because
   the belt is the school's — not the app's. */
const COURSES = ((window.CURRICULUM && CURRICULUM.courses) || [])
  .slice().sort((a, b) => (a.order || 0) - (b.order || 0));
const COURSE_BY_ID = {}; COURSES.forEach(c => COURSE_BY_ID[c.id] = c);
const COURSE_BY_TRACK = {}; COURSES.forEach(c => { if (!COURSE_BY_TRACK[c.track]) COURSE_BY_TRACK[c.track] = c; });

/* ---------- catalogue: flatten CURRICULUM into ITEMS/SEQUENCE ---------- */
const BELTS = (window.CURRICULUM && CURRICULUM.belts) || [];
const BELT_BY_ID = {}; BELTS.forEach(b => BELT_BY_ID[b.id] = b);
const DOMAIN_BY_ID = {}; ((window.CURRICULUM && CURRICULUM.domains) || []).forEach(d => DOMAIN_BY_ID[d.id] = d);
const UNIT_BY_ID = {}; BELTS.forEach(b => (b.units || []).forEach(u => UNIT_BY_ID[u.id] = Object.assign({ beltId: b.id }, u)));

const ITEMS = {};
const SEQUENCE = [];
((window.CURRICULUM && CURRICULUM.items) || []).forEach(raw => {
  if (ITEMS[raw.id]) return;
  const item = Object.assign({}, raw);
  item.name = item.nameEnglish || item.en || item.id;
  item.en = item.en || item.nameEnglish || '';
  item.ko = item.ko || item.nameHangul || '';
  item.rom = item.rom || item.romanization || '';
  const u = UNIT_BY_ID[item.unit];
  item.unitTitle = u ? u.title : '';
  const b = BELT_BY_ID[item.beltId];
  item.beltOrder = b ? b.order : 999;
  ITEMS[item.id] = item;
  SEQUENCE.push(item.id);
});

/* Hangul → romanization lookup, so romanization can follow Korean text
   everywhere (MC options, reveals, banners) while the toggle is on. */
const KO_ROM = {};
SEQUENCE.forEach(id => { const it = ITEMS[id]; if (it.ko && it.rom) KO_ROM[it.ko] = it.rom; });
BELTS.forEach(b => { if (b.nameKorean && b.rom) KO_ROM[b.nameKorean] = b.rom; });
const SAY_ROM = {
  '잘했어요': 'jal-hae-sseo-yo', '좋아요': 'jo-a-yo', '맞아요': 'ma-ja-yo',
  '완벽해요': 'wan-byeok-hae-yo', '완벽': 'wan-byeok', '최고예요': 'choe-go-ye-yo',
  '대박': 'dae-bak', '불이야': 'bul-i-ya', '수고했어요': 'su-go-hae-sseo-yo',
  '괜찮아요': 'gwaen-chan-a-yo', '다시': 'da-si', '정확해요': 'jeong-hwak-hae-yo',
  '빨라요': 'ppal-la-yo', '들었어요': 'deul-eo-sseo-yo'
};
function romFor(text) {
  if (!S || !S.settings.showRomanization || !text) return '';
  const base = String(text).replace(/[!?.…~]/g, '').trim();
  return SAY_ROM[base] || KO_ROM[base] || '';
}

/* ---------- ladders per kind (knowledge rungs only — physical
   practice and instructor verification are NOT FSRS cards) ---------- */
function ladderFor(item) {
  if (item.kind === 'term') return item.ko ? ['recog', 'listen', 'recallKO', 'speak'] : ['recog'];
  if (item.kind === 'concept') {
    const q = item.quiz || {};
    const l = ['c-recog', 'c-example', 'c-unsafe', 'c-scenario'].filter(s => q[s.slice(2)]);
    return l.length ? l : ['c-recog'];   // recog falls back to key points if no quiz authored
  }
  if (item.kind === 'technique') {
    const l = ['t-id'];
    if (item.attackOrGrab || item.startingPosition) l.push('t-situation');
    if ((item.stepSequence || []).length >= 3) l.push('t-steps');
    if ((item.commonErrors || []).length && (item.keyDetails || []).length >= 2) l.push('t-error');
    if ((item.keyDetails || []).length && (item.commonErrors || []).length) l.push('t-points');
    return l;
  }
  return ['recog'];
}

const SKILL_LABEL = {
  recog: 'Meaning', listen: 'By ear', recallKO: 'Korean term', speak: 'Say it in Korean',
  'c-recog': 'Recognize it', 'c-example': 'Pick the example', 'c-unsafe': 'Spot the unsafe call', 'c-scenario': 'Apply it',
  't-id': 'Name the technique', 't-situation': 'Read the situation', 't-steps': 'Order the steps',
  't-error': 'Spot the mistake', 't-points': 'Key points'
};

/* ---------- safety classifications ---------- */
const SAFETY_META = {
  knowledgeOnly:                { label: 'Knowledge only',                  cls: '' },
  soloSafe:                     { label: 'Solo practice OK',                cls: 'mast' },
  partnerWithCare:              { label: 'Partner drills — in class',      cls: 'restrict' },
  instructorSupervisionRequired:{ label: 'Instructor supervision required', cls: 'restrict' },
  academyOnly:                  { label: 'Academy only',                    cls: 'restrict' },
  restrictedByAge:              { label: 'Age-restricted',                  cls: 'restrict' }
};
function isRestricted(item) {
  return ['partnerWithCare', 'instructorSupervisionRequired', 'academyOnly', 'restrictedByAge'].includes(item.safetyClass);
}
function canPractice(item) {
  return !!(item.practiceAssignment && (item.practiceAssignment.items || []).length &&
    ['soloSafe', 'knowledgeOnly'].includes(item.safetyClass));
}

/* ---------- belt helpers ---------- */
function activeBelt() { return BELT_BY_ID[S.settings.activeBeltId] || BELTS[0]; }
function beltItems(beltId, includeOptional) {
  return SEQUENCE.filter(id => ITEMS[id].beltId === beltId && (includeOptional || !ITEMS[id].optional));
}
function knowledgeMastered(item) {
  const l = ladderFor(item);
  return l.length > 0 && l.every(sk => isHolding(S.cards[ck(item.id, sk)]));
}
function itemStatus(item) {
  if (item.kind === 'technique' && S.verifications[item.id]) return 'verified';
  if (knowledgeMastered(item)) return (item.kind === 'technique' && item.instructorRequired) ? 'ready' : 'mastered';
  if (S.introduced[item.id]) return 'learning';
  return 'new';
}
const STATUS_META = {
  new:      { l: 'Not started',                 cls: '' },
  learning: { l: 'Learning',                    cls: 'learn' },
  mastered: { l: 'Knowledge mastered',          cls: 'mast' },
  ready:    { l: 'Ready to practice in class',  cls: 'ready' },
  verified: { l: 'Instructor verified',         cls: 'ver' }
};

/* One belt's five readiness measures. Never collapsed to one number.
   Pass a course to measure only that course's half of the belt. */
function beltStats(belt, courseSel) {
  const now = Date.now();
  const course = asCourse(courseSel);
  const ids = beltItems(belt.id, false).filter(id => !course || courseIdOf(ITEMS[id]) === course.id);
  const practiced = new Set(S.practiceLog.map(p => p.itemId));
  let intro = 0, mastered = 0, rsum = 0, rcount = 0,
      practicable = 0, practicedN = 0, vreq = 0, vdone = 0;
  ids.forEach(id => {
    const it = ITEMS[id];
    if (S.introduced[id]) intro++;
    if (knowledgeMastered(it)) mastered++;
    ladderFor(it).forEach(sk => {
      const c = S.cards[ck(id, sk)];
      if (c && c.state !== 'new') { rsum += currentR(c, now); rcount++; }
    });
    if (canPractice(it)) { practicable++; if (practiced.has(id)) practicedN++; }
    if (it.kind === 'technique' && it.instructorRequired) { vreq++; if (S.verifications[id]) vdone++; }
  });
  return { total: ids.length, intro, mastered, retention: rcount ? rsum / rcount : null,
           practicable, practiced: practicedN, vreq, vdone };
}
function cumulativeStats(belt, courseSel) {
  const prev = BELTS.filter(b => b.order < belt.order);
  const agg = { total: 0, intro: 0, mastered: 0, vreq: 0, vdone: 0 };
  prev.forEach(b => { const s = beltStats(b, courseSel);
    agg.total += s.total; agg.intro += s.intro; agg.mastered += s.mastered;
    agg.vreq += s.vreq; agg.vdone += s.vdone; });
  return agg;
}

/* ---------- belt gating: schedule only your belt and below.
   FSRS never unlocks a belt, and never unlocks physical practice. */
function eligibleSequence(courseSel) {
  const ab = activeBelt();
  const course = asCourse(courseSel);
  return SEQUENCE.filter(id => ITEMS[id].beltOrder <= ab.order &&
    (!course || courseIdOf(ITEMS[id]) === course.id));
}

/* ---------- milestones (hapkido) ---------- */
const KNOW_MILESTONES = [5, 15, 30, 50, 80, 120];
function checkMilestones(key, before, after) {
  const item = cardItem(key);
  if (!item) return;
  const label = item.ko || item.name || '';

  if (before && before.S && before.S < 21 && after.S >= 21) {
    const r = item.ko && item.rom ? item.rom + ' · ' : '';
    sess.celebrations.push({ title: label, sub: r + 'locked into long-term memory', ko: !!item.ko, big: false });
  }

  // Milestones are counted per course, so each one gets its own journey.
  const course = courseOf(item);
  const held = stats(course).wordsKnown;
  const mkey = course ? 'k:' + course.id + ':' : 'k';
  for (const m of KNOW_MILESTONES) {
    if (held >= m && !S.milestones[mkey + m]) {
      S.milestones[mkey + m] = Date.now();
      sess.celebrations.push({
        title: m + ' ITEMS',
        sub: 'holding in ' + (course ? course.nameEnglish.toLowerCase() : 'long-term memory'), big: m >= 30 });
      break;
    }
  }

  if (item.kind === 'technique' && !S.milestones['tk:' + item.id] && knowledgeMastered(item)) {
    S.milestones['tk:' + item.id] = Date.now();
    sess.celebrations.push({
      title: 'KNOWLEDGE MASTERED',
      sub: item.name + (item.instructorRequired ? ' — now show it in class' : ''), big: false });
  }

  if (item.unit && !S.milestones['u' + item.unit]) {
    const ids = SEQUENCE.filter(id => ITEMS[id].unit === item.unit);
    if (ids.length && ids.every(id => S.introduced[id])) {
      S.milestones['u' + item.unit] = Date.now();
      sess.celebrations.push({ title: 'UNIT COMPLETE', sub: item.unitTitle || '', big: true });
    }
  }

  const belt = BELT_BY_ID[item.beltId];
  if (belt && course) {
    const ckey = 'b:' + course.id + ':' + belt.id;
    if (!S.milestones[ckey]) {
      const cs = beltStats(belt, course);
      if (cs.total && cs.mastered === cs.total) {
        S.milestones[ckey] = Date.now();
        sess.celebrations.push({
          title: belt.nameEnglish.toUpperCase() + ' · ' + course.shortName.toUpperCase(),
          sub: 'that whole course finished for this belt', big: true });
      }
    }
  }
  if (belt && !S.milestones['b' + belt.id]) {
    const bs = beltStats(belt);
    if (bs.total && bs.mastered === bs.total) {
      S.milestones['b' + belt.id] = Date.now();
      sess.celebrations.push({
        title: belt.nameEnglish.toUpperCase() + ' · BOTH COURSES',
        sub: 'every requirement mastered — polish it in class', big: true });
    }
  }
}

/* ---------- course identity: colour, glyph, celebration particles ----
   The whole app repaints when you switch course. FX_JAMO is a const in
   the engine, so its CONTENTS are swapped rather than the binding —
   the FX system keeps working untouched. */
function applyCourseIdentity() {
  const c = activeCourse();
  const root = document.documentElement;
  const light = S.settings.theme === 'light';
  COURSES.forEach(x => root.classList.remove('course-' + x.id));
  if (!c) { root.style.removeProperty('--accent'); root.style.removeProperty('--accent-dim'); }
  else {
    root.classList.add('course-' + c.id);
    root.style.setProperty('--accent', light ? (c.accentLight || c.accent) : c.accent);
    root.style.setProperty('--accent-dim', c.accentDim || (light ? c.accent : c.accentLight) || '#2b4d80');
  }
  const glyphs = (c && c.fxGlyphs && c.fxGlyphs.length) ? c.fxGlyphs
    : ['합', '기', '도', '원', '유', '화', '수', '련', '띠', '한'];
  FX_JAMO.length = 0;
  glyphs.forEach(g => FX_JAMO.push(g));
}
function courseMark(c, size) {
  if (!c) return '';
  return `<span class="cmark ko" style="--cacc:${c.accent};${size ? `--csz:${size}px` : ''}">${esc(c.glyph || '')}</span>`;
}

/* ---------- settings & state shape ---------- */
function normalizeSettings() {
  Object.keys(SETTING_BOUNDS).forEach(k => {
    const [lo, hi] = SETTING_BOUNDS[k];
    const n = Number(S.settings[k]);
    S.settings[k] = Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : DEFAULTS.settings[k];
  });
  if (S.settings.theme !== 'light') S.settings.theme = 'dark';
  S.settings.showRomanization = !!S.settings.showRomanization;
  if (typeof S.settings.ttsVoice !== 'string') S.settings.ttsVoice = '';
  if (!['full', 'subtle', 'off'].includes(S.settings.fxLevel)) S.settings.fxLevel = 'full';
  const vol = Number(S.settings.volume);
  S.settings.volume = Number.isFinite(vol) ? Math.min(1, Math.max(0, vol)) : 0.5;
  ['sound', 'spokenPraise'].forEach(k => { S.settings[k] = !!S.settings[k]; });
  if (!S.milestones || typeof S.milestones !== 'object') S.milestones = {};
  if (!BELT_BY_ID[S.settings.activeBeltId]) S.settings.activeBeltId = BELTS.length ? BELTS[0].id : '';
  // '' is a legitimate value: it means "hasn't picked a course yet", which
  // is what puts a returning-from-nothing student on the course picker.
  if (typeof S.settings.activeCourseId !== 'string' ||
      (S.settings.activeCourseId && !COURSE_BY_ID[S.settings.activeCourseId])) S.settings.activeCourseId = '';
  if (!Array.isArray(S.practiceLog)) S.practiceLog = [];
  if (!S.verifications || typeof S.verifications !== 'object') S.verifications = {};
  if (!S.instructor || typeof S.instructor !== 'object') S.instructor = { pinHash: null, log: [] };
  if (!Array.isArray(S.instructor.log)) S.instructor.log = [];
  S.verifySeen = Number(S.verifySeen) || 0;
  // Curriculum version stamp: cards for removed items retire via dueCards();
  // verifications keep the version they were granted under.
  S.curriculumVersion = CURRICULUM.meta.version;
}

/* ---------- which course does a thing belong to? ----------
   Driven by domain.track in the curriculum data — fully configurable. */
function itemTrack(item) {
  const d = DOMAIN_BY_ID[item.domain];
  return d && d.track === 'technique' ? 'technique' : 'knowledge';
}
function unitTrack(u) {
  const ids = SEQUENCE.filter(id => ITEMS[id].unit === u.id);
  return ids.some(id => itemTrack(ITEMS[id]) === 'technique') ? 'technique' : 'knowledge';
}
function courseOf(item) { return COURSE_BY_TRACK[itemTrack(item)] || null; }
function courseIdOf(item) { const c = courseOf(item); return c ? c.id : ''; }
function courseOfUnit(u) { return COURSE_BY_TRACK[unitTrack(u)] || null; }

/* Everything that takes a "course" accepts a course object, a course id,
   a bare track name ('knowledge'/'technique'), or nothing for "both". */
function asCourse(sel) {
  if (!sel) return null;
  if (typeof sel === 'object') return sel.id ? sel : null;
  return COURSE_BY_ID[sel] || COURSE_BY_TRACK[sel] || null;
}
function activeCourse() { return COURSE_BY_ID[S.settings.activeCourseId] || null; }
function otherCourses() {
  const a = activeCourse();
  return COURSES.filter(c => !a || c.id !== a.id);
}
function courseUnits(courseSel, belt) {
  const course = asCourse(courseSel);
  return ((belt || activeBelt()).units || []).filter(u => !course || unitTrack(u) === course.track);
}

/* Each course carries its own daily new-item budget — studying one
   never eats the other's allowance, exactly as two language courses
   would behave. Older saves simply start today's counters at zero. */
function newToday(courseSel) {
  const rec = dayRec(todayKey());
  const course = asCourse(courseSel);
  if (!course) return rec.newItems || 0;
  return (rec.newByCourse || {})[course.id] || 0;
}
function countNewItem(item) {
  const rec = dayRec(todayKey());
  rec.newItems = (rec.newItems || 0) + 1;
  const c = courseOf(item);
  if (!c) return;
  if (!rec.newByCourse) rec.newByCourse = {};
  rec.newByCourse[c.id] = (rec.newByCourse[c.id] || 0) + 1;
}

function nextNewItems(n, courseSel) {
  const out = [];
  const seq = eligibleSequence(courseSel);
  for (const id of seq) {
    if (out.length >= n) break;
    if (S.introduced[id]) continue;
    out.push(id);
  }
  return out;
}

function plan(courseSel) {
  unlockSkills();
  const course = asCourse(courseSel);
  const now = Date.now();
  let due = dueCards(now);
  if (course) due = due.filter(k => { const it = cardItem(k); return it && courseIdOf(it) === course.id; });
  const newSlots = Math.max(0, S.settings.dailyNew - newToday(course));
  const newIds = nextNewItems(newSlots, course);
  return {
    course,
    due: due.slice(0, S.settings.reviewCap),
    dueTotal: due.length,
    newIds,
    remainingInCourse: eligibleSequence(course).filter(id => !S.introduced[id]).length
  };
}
function planTotal(courseSel) { const p = plan(courseSel); return p.due.length + p.newIds.length; }

/* Note the deliberate asymmetry in defaults: plan/stats/beltStats with
   no course mean "everything", because that is what the shared Progress
   and Belt views want. startSession with no course means "the course I
   am studying", because that is what the big button on the path means —
   the engine calls it bare. '*' is the explicit everything-session. */
function startSession(courseSel) {
  const course = courseSel === '*' ? null : (asCourse(courseSel) || activeCourse());
  const p = plan(course);
  const steps = [];
  p.due.forEach(k => steps.push({ t: 'card', key: k }));
  shuffle(steps);

  const teach = p.newIds.map(id => ({ t: 'teach', id }));
  const merged = [];
  if (teach.length === 0) {
    merged.push(...steps);
  } else {
    const gap = Math.max(1, Math.floor(steps.length / teach.length) || 1);
    let si = 0, ti = 0;
    while (si < steps.length || ti < teach.length) {
      for (let g = 0; g < gap && si < steps.length; g++) merged.push(steps[si++]);
      if (ti < teach.length) merged.push(teach[ti++]);
    }
  }

  if (!merged.length) {
    view = 'today'; sess = null;
    showToast(course ? 'Nothing is due in ' + course.nameEnglish + ' right now.' : 'Nothing is due right now.');
    render();
    return;
  }

  cancelFx();
  resetTransient();
  sess = {
    queue: merged, pos: 0, combo: 0, bestCombo: 0, lastTier: 0,
    justMissed: false, pendingFx: null, celebrations: [],
    started: Date.now(), answered: 0, correct: 0,
    againKeys: new Set(), newSeen: 0,
    plannedNew: p.newIds.length, plannedReviews: p.due.length,
    reveal: null, lastGradeKey: null,
    budgetMs: S.settings.sessionMinutes * 60000, overtime: false,
    courseId: course ? course.id : null,
    track: course ? course.track : null
  };
  view = 'session';
  render();
}

/* ---------- stats (Hanbit's, with hapkido item kinds) ----------
   Pass a course to get that course's numbers only. Day records,
   streak and time stay shared: one student, one training habit. */
function stats(courseSel) {
  const now = Date.now();
  const course = asCourse(courseSel);
  const inCourse = id => !course || courseIdOf(ITEMS[id]) === course.id;
  const keys = Object.keys(S.cards).filter(k => ITEMS[k.split('|')[0]] && inCourse(k.split('|')[0]));
  let learning = 0, young = 0, mature = 0, rsum = 0, rcount = 0;
  keys.forEach(k => {
    const c = S.cards[k];
    if (c.state === 'new') { learning++; return; }
    const s = c.S || 0;
    if (s >= 21) mature++; else if (s >= 3) young++; else learning++;
    rsum += currentR(c, now); rcount++;
  });

  const eligible = new Set(eligibleSequence(course));
  const introducedItems = Object.keys(S.introduced).filter(id => ITEMS[id] && eligible.has(id));
  const wordsKnown = introducedItems.filter(id => {
    const it = ITEMS[id];
    if (!['term', 'concept', 'technique'].includes(it.kind)) return false;
    const first = ladderFor(it)[0];
    const c = S.cards[ck(id, first)];
    return c && c.state !== 'new' && (c.S || 0) >= 3;
  }).length;

  let correct = 0, total = 0;
  Object.keys(S.days).forEach(k => { correct += S.days[k].correct; total += S.days[k].total; });
  const recent = S.log.filter(l => l.counted && l.t > now - 30 * DAY);
  let rcorrect = 0, rtotal = 0;
  recent.forEach(l => { const c = S.cards[l.key]; if (!c) return; rtotal++; if (l.grade > 1) rcorrect++; });

  const forecast = [];
  for (let d = 0; d < 14; d++) {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const from = start.getTime() + d * DAY, to = from + DAY;
    let n = 0;
    keys.forEach(k => { const c = S.cards[k]; if (c.state !== 'new' && c.due >= (d === 0 ? 0 : from) && c.due < to) n++; });
    forecast.push(n);
  }

  let streak = 0, misses = 0;
  for (let d = 0; d < 400; d++) {
    const k = dayKeyBack(d);
    const rec = S.days[k];
    const studied = rec && rec.reviews > 0;
    if (studied) { streak++; misses = 0; }
    else if (d === 0) { /* today is not over yet */ }
    else { misses++; if (misses > 2) break; }
  }

  const timeToday = (S.days[todayKey()] || {}).ms || 0;
  let totalMs = 0; Object.keys(S.days).forEach(k => totalMs += S.days[k].ms || 0);

  return {
    learning, young, mature, cards: keys.length,
    predictedR: rcount ? rsum / rcount : 0,
    measuredR: rtotal ? rcorrect / rtotal : (total ? correct / total : 0),
    reviewsAll: total, wordsKnown,
    introduced: introducedItems.length,
    courseTotal: eligible.size,
    forecast, streak, timeToday, totalMs
  };
}


/* ================================================================
   HAPKIDO LAYER — exercise generation, session rendering
   ================================================================ */

function mcOptions(answer, cands) {
  return uniqBy([answer].concat((cands || []).filter(x => x != null && x !== '' && x !== answer)), x => x).slice(0, 4);
}
function termPool(item, n) {
  return pool(i => i.kind === 'term' && i.domain === item.domain, item.id, n)
    .concat(pool(i => i.kind === 'term', item.id, n));
}

function makeExercise(key) {
  const item = cardItem(key);
  const skill = cardSkill(key);
  const ex = { key, item, skill, kind: item.kind };

  if (item.kind === 'term') {
    if (skill === 'recog') {
      ex.type = 'mc';
      ex.prompt = 'What does this mean?';
      ex.target = item.ko;
      ex.sub = S.settings.showRomanization ? item.rom : '';
      ex.answer = item.en;
      ex.options = mcOptions(item.en, termPool(item, 8).map(i => i.en));
      ex.speakAfter = item.ko;
    } else if (skill === 'listen') {
      ex.type = 'mc';
      ex.prompt = 'Listen — which term is it?';
      ex.audioOnly = item.ko;
      ex.answer = item.en;
      ex.options = mcOptions(item.en, termPool(item, 8).map(i => i.en));
      ex.revealKo = item.ko;
    } else if (skill === 'recallKO') {
      ex.type = 'mc';
      ex.prompt = 'Which is the Korean for:';
      ex.target = item.en;
      ex.targetEn = true;
      ex.answer = item.ko;
      ex.koOptions = true;
      ex.options = mcOptions(item.ko, pool(i => i.kind === 'term' && i.ko, item.id, 8).map(i => i.ko));
      ex.speakAfter = item.ko;
    } else { // speak — honest self-graded production, out loud
      ex.type = 'self';
      ex.prompt = 'Say it in Korean — out loud, before you reveal.';
      ex.target = item.en;
      ex.targetEn = true;
      ex.answer = item.ko;
      ex.sub2 = item.rom;
      ex.speakAfter = item.ko;
    }
  }

  else if (item.kind === 'concept') {
    const q = (item.quiz || {})[skill.slice(2)];
    ex.type = 'mc';
    if (q && q.a) {
      ex.prompt = q.q || 'Choose the best answer.';
      ex.target = q.target || item.name;
      ex.answer = q.a;
      ex.options = mcOptions(q.a, (q.d || []).slice());
      if (q.why) ex.why = q.why;
    } else {
      // No authored quiz for this rung — fall back to a key-point check.
      const kp = (item.keyPoints || [])[0] || item.name;
      ex.prompt = 'Which is a key point of this concept?';
      ex.target = item.name;
      ex.answer = kp;
      ex.options = mcOptions(kp, pool(i => i.kind === 'concept' && (i.keyPoints || []).length, item.id, 6)
        .map(i => i.keyPoints[0]));
    }
    ex.targetEn = true;
  }

  else { // technique — knowledge rungs only
    if (skill === 't-id') {
      ex.type = 'mc';
      ex.prompt = 'Which technique is this?';
      ex.target = item.purpose || item.attackOrGrab || '';
      ex.targetEn = true;
      ex.answer = item.name;
      ex.options = mcOptions(item.name, pool(i => i.kind === 'technique', item.id, 8).map(i => i.name));
    } else if (skill === 't-situation') {
      ex.type = 'mc';
      ex.prompt = 'What situation does this technique answer?';
      ex.target = item.name;
      ex.targetEn = true;
      ex.answer = item.attackOrGrab || item.startingPosition;
      ex.options = mcOptions(ex.answer,
        pool(i => i.kind === 'technique' && (i.attackOrGrab || i.startingPosition), item.id, 8)
          .map(i => i.attackOrGrab || i.startingPosition));
    } else if (skill === 't-steps') {
      ex.type = 'build';
      ex.stepMode = true;
      ex.prompt = 'Arrange the steps of ' + item.name + ' in order.';
      ex.tiles = item.stepSequence.map((w, i) => ({ w, i }));
      shuffle(ex.tiles);
      ex.orderAnswer = item.stepSequence;
      ex.answer = item.stepSequence.join(' → ');
    } else if (skill === 't-error') {
      ex.type = 'mc';
      ex.prompt = 'One of these is a COMMON MISTAKE in ' + item.name + '. The rest are correct practice. Which is the mistake?';
      ex.answer = pick(item.commonErrors);
      ex.options = mcOptions(ex.answer, shuffle(item.keyDetails.slice()));
      ex.why = 'Knowing the mistake trains your eye — you will spot it in class before it costs anyone.';
    } else { // t-points
      ex.type = 'mc';
      ex.prompt = 'Which is a key point of ' + item.name + '?';
      ex.answer = pick(item.keyDetails);
      ex.options = mcOptions(ex.answer,
        shuffle((item.commonErrors || []).slice())
          .concat(pool(i => i.kind === 'technique' && (i.keyDetails || []).length, item.id, 4)
            .map(i => i.keyDetails[0])));
    }
    if (item.ko) ex.speakAfter = item.ko;
  }

  return ex;
}

/* Commentary routing for hapkido skills. */
function commentaryFor(ctx) {
  const n = ctx.combo || 0;
  if (n >= 12) return pick(COMMENTARY.combo12);
  if (n >= 8) return pick(COMMENTARY.combo8);
  if (n >= 5) return pick(COMMENTARY.combo5);
  if (ctx.nemesis) return pick(COMMENTARY.nemesis);
  if (n >= 3) return pick(COMMENTARY.combo3);
  if (ctx.comeback) return pick(COMMENTARY.comeback);
  if (ctx.close) return pick(COMMENTARY.close);
  if (ctx.skill === 'speak' || ctx.skill === 'recallKO') return pick(COMMENTARY.production);
  if (ctx.skill === 'listen') return pick(COMMENTARY.listening);
  if (ctx.skill === 't-steps') return pick(COMMENTARY.sequencing);
  if (ctx.fast) return pick(COMMENTARY.fast);
  return pick(COMMENTARY.correct);
}

/* Dojang-flavored line banks (mutating the const object is fine). */
COMMENTARY.production = [
  'Recalled cold, out loud. That is the version that shows up in class.',
  'From memory, not recognition — 잘했어요!',
  'You own that term now. Use it next class.',
  'Produced from nothing. That is the hard skill.'
];
COMMENTARY.listening = [
  'Understood by ear — exactly how commands arrive in class.',
  'Heard it and knew it. Line-up Korean is yours.',
  '들었어요! Your ear is training.'
];
COMMENTARY.sequencing = [
  'Steps in order — your body learns faster when your head knows the map.',
  'Sequence locked. In class you can think about feel, not what comes next.',
  'That is the whole technique, in order, from memory.'
];

/* ---------- session shell: same as the engine's, plus the course you
   are actually in. A session belongs to one course unless you asked
   for the everything-review. ---------- */
function renderSession() {
  const step = currentStep();
  if (!step) return shell(renderDone());

  const total = sess.queue.length;
  const done = sess.pos;
  const tier = comboTier(sess.combo);
  const c = sess.courseId ? COURSE_BY_ID[sess.courseId] : null;
  const head = `
  <div class="sess-head">
    <button class="iconbtn" data-act="quit" title="End session">✕</button>
    ${c ? `<span class="sess-course" title="${esc(c.nameEnglish)}">${courseMark(c)}<span>${esc(c.shortName)}</span></span>`
        : (COURSES.length ? '<span class="sess-course both"><span>Both courses</span></span>' : '')}
    <div class="bar"><i style="width:${Math.round(done / Math.max(1, total) * 100)}%"></i></div>
    ${sess.combo >= 2 ? `<span class="combo-chip t${tier}">${tier >= 3 ? '🔥' : ''} ${sess.combo} streak</span>` : ''}
    <span class="count">${done} / ${total}</span>
  </div>`;

  if (sess.askStop) {
    return `<div id="app-inner" class="session-wrap">${head}
      <div class="card"><h2>You have hit ${S.settings.sessionMinutes} minutes</h2>
      <p class="sub">This is the point where extra reviews start paying less per minute, and where a second short session tomorrow beats pushing on today. ${sess.queue.length - sess.pos} cards are still queued — they will simply be waiting.</p>
      <div class="row"><button class="btn primary" data-act="stopnow">Stop here</button><button class="btn" data-act="keepgoing">Keep going</button></div>
      </div></div>`;
  }

  if (step.t === 'teach') return `<div class="session-wrap">${head}${renderTeach(ITEMS[step.id])}</div>`;
  return `<div class="session-wrap">${head}${renderExercise(step)}</div>`;
}

/* ---------- session rendering (mc / build-steps / self) ---------- */
function renderExercise(step) {
  if (!liveEx || liveEx.key !== step.key || liveEx._pos !== sess.pos) {
    liveEx = makeExercise(step.key);
    liveEx._pos = sess.pos;
    composer.reset();
    sess.build = [];
    sess.selfOpen = false;
    exStart = Date.now();
  }
  const ex = liveEx;
  const fresh = S.cards[step.key] && S.cards[step.key].freshSkill;

  let promptBlock = '';
  if (ex.audioOnly) {
    promptBlock = `<div class="q-kind">${esc(SKILL_LABEL[ex.skill])}</div>
      <div class="q-prompt">${esc(ex.prompt)}</div>
      <div class="row" style="justify-content:center;padding:8px 0 4px">
        <button aria-label="Play audio" class="speak lg" data-speak="${esc(ex.audioOnly)}">${SPEAKER_SVG}</button>
      </div>
      <div class="faint" style="text-align:center;font-size:12px;margin-top:8px">Tap to replay</div>`;
  } else {
    promptBlock = `<div class="q-kind">${esc(SKILL_LABEL[ex.skill])}${fresh ? ' · new exercise type' : ''}</div>
      <div class="q-prompt">${esc(ex.prompt)}</div>
      ${ex.target ? `<div class="q-target ${ex.targetEn ? 'en' : 'ko'} ${(ex.target || '').length > 26 ? 'small' : ''}">${esc(ex.target)}</div>` : ''}
      ${ex.sub ? `<div class="q-rom">${esc(ex.sub)}</div>` : ''}`;
  }

  let answerBlock = '';
  if (ex.type === 'mc') {
    if (!ex._opts) ex._opts = shuffle(ex.options.slice());
    const opts = ex._opts;
    answerBlock = `<div class="grid" style="margin-top:14px">${opts.map(o => {
      let cls = 'opt' + (ex.koOptions ? ' ko-opt' : '');
      if (sess.reveal) {
        if (o === ex.answer) cls += ' right';
        else if (o === sess.reveal.picked) cls += ' wrong';
      }
      const rom = ex.koOptions ? romFor(o) : '';
      return `<button class="${cls}" data-pick="${esc(o)}" ${sess.reveal ? 'disabled' : ''}>${esc(o)}${rom ? `<small>${esc(rom)}</small>` : ''}</button>`;
    }).join('')}</div>`;
  } else if (ex.type === 'build') {
    const chosen = (sess.build || []);
    const full = chosen.length === ex.tiles.length;
    answerBlock = `<div class="build-target steps" id="buildtarget">${chosen.map((t, i) =>
      `<button class="tile step" data-unpick="${i}"><span class="stepnum">${i + 1}.</span><span>${esc(t.w)}</span></button>`).join('')
      || '<span class="faint" style="font-size:13px;align-self:center">tap the steps in order, first to last</span>'}</div>
      <div class="build-pool steps">${ex.tiles.map(t =>
      `<button class="tile step ${chosen.some(c => c.i === t.i) ? 'used' : ''}" data-pickt="${t.i}">${esc(t.w)}</button>`).join('')}</div>
      ${sess.reveal ? '' : `<div class="row" style="margin-top:12px">
        <button class="btn primary" data-act="submit" ${full ? '' : 'disabled'}>Check order</button>
        <button class="btn ghost" data-act="giveup">Show me</button></div>`}`;
  } else if (ex.type === 'self') {
    if (!sess.reveal && !sess.selfOpen) {
      answerBlock = `<div class="row" style="margin-top:16px">
        <button class="btn primary" data-act="selfreveal">Reveal the Korean <span class="faint" style="font-weight:400;font-size:11.5px">↵</span></button>
        <span class="faint" style="font-size:12px">Actually say it first — producing the sound is the exercise.</span></div>`;
    } else if (!sess.reveal) {
      answerBlock = `<div class="q-card" style="margin-top:12px;min-height:0">
        <div class="answer ko" style="font-size:32px">${esc(ex.answer)}</div>
        ${S.settings.showRomanization && ex.sub2 ? `<div class="q-rom">${esc(ex.sub2)}</div>` : ''}
        <div class="row" style="margin-top:10px">
          <button aria-label="Play audio" class="speak" data-speak="${esc(ex.answer)}">${SPEAKER_SVG}</button>
          <span class="faint" style="font-size:12px">Compare, then grade yourself honestly — the schedule only works on the truth.</span>
        </div></div>
        <div class="gradebar" style="margin-top:12px">
          <button data-selfgrade="1">Not yet<b>see it again soon</b></button>
          <button data-selfgrade="3" class="keep">Got it<b>with effort</b></button>
          <button data-selfgrade="4">Instant<b>easy</b></button>
        </div>`;
    }
  }

  const fb = sess.reveal ? renderFeedback(ex) : '';
  return `<div class="q-card">${promptBlock}</div>${answerBlock}${fb}`;
}

function renderFeedback(ex) {
  const r = sess.reveal;
  const good = r.result === 'right' || r.result === 'close';
  const item = ex.item;

  let answerLine = '';
  if (ex.stepMode) {
    answerLine = `<ol class="fb-steps">${ex.orderAnswer.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
  } else if (r.result !== 'right' || ex.revealKo) {
    const shown = ex.revealKo || ex.answer;
    const rom = romFor(shown);
    answerLine = ex.koOptions || (!ex.targetEn && item.kind === 'term')
      ? `<div class="answer ko">${esc(shown)}</div>${rom ? `<div class="q-rom" style="font-size:13px;margin-top:2px">${esc(rom)}</div>` : ''}`
      : `<div class="answer" style="font-size:17px;font-family:inherit">${esc(shown)}</div>`;
  }

  const extra = [];
  if (item.kind === 'term') {
    extra.push(`<div class="note"><span class="ko">${esc(item.ko)}</span> · ${esc(item.rom)} — ${esc(item.en)}</div>`);
    if (item.note) extra.push(`<div class="note">${esc(item.note)}</div>`);
  }
  if (ex.why) extra.push(`<div class="why">${esc(ex.why)}</div>`);
  if (item.kind === 'technique' && isRestricted(item) && (ex.skill === 't-steps' || r.result !== 'right')) {
    extra.push(`<div class="why">Remember: ${esc(item.name)} is practiced physically only ${item.safetyClass === 'partnerWithCare' ? 'with a partner in class' : 'under instructor supervision'}.</div>`);
  }

  const verdict = r.result === 'right' ? 'Correct'
    : r.result === 'close' ? 'Almost'
      : r.result === 'shown' ? 'Here it is' : 'Not quite';
  const mark = good
    ? '<svg class="verdict-mark" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6"/></svg>'
    : '<svg class="verdict-mark" viewBox="0 0 26 26"><path d="M5 13h16"/></svg>';

  const adjust = good && ex.type !== 'self' ? `<div class="gradebar">
      <button data-grade="2">Felt hard<b>sooner</b></button>
      <button data-grade="3" class="keep">Fine<b>keep schedule</b></button>
      <button data-grade="4">Instant<b>later</b></button>
    </div>` : '';

  return `<div class="fb ${good ? 'right' : 'wrong'}">
    <div class="row" style="align-items:flex-start;gap:9px">
      ${mark}
      <div style="flex:1">
        ${r.line ? `<div class="commentary">${esc(r.line)}${romFor(r.line) ? ` <span class="faint" style="font-weight:400;font-size:11px;font-family:var(--mono)">${esc(romFor(r.line))}</span>` : ''}</div>` : ''}
        <div class="verdict" style="color:var(--tx-dim);font-weight:500;font-size:12.5px">${verdict}</div>
      </div>
    </div>
    ${answerLine}
    ${extra.join('')}
    <div class="row" style="margin-top:12px">
      ${ex.speakAfter ? `<button aria-label="Play audio" class="speak" data-speak="${esc(ex.speakAfter)}">${SPEAKER_SVG}</button>` : ''}
      <button class="btn primary" data-act="next">Continue <span class="faint" style="font-weight:400;font-size:11.5px">↵</span></button>
    </div>
    ${adjust}
  </div>`;
}

/* Submit for step-sequencing (order check) — mc uses pickMC, self uses selfGrade. */
function submitAnswer() {
  const ex = liveEx;
  if (!ex || sess.reveal || ex.type !== 'build') return;
  const chosen = sess.build || [];
  if (ex.stepMode && chosen.length !== ex.tiles.length) return;
  const result = chosen.length && chosen.every((t, idx) => t.i === idx) ? 'right' : 'wrong';
  const elapsed = Date.now() - exStart;
  const grade = result === 'right' ? (elapsed < 14000 ? 4 : 3) : 1;
  const line = scoreAnswer(ex, result, elapsed, grade);
  sess.reveal = { result, line };
  if (ex.speakAfter) speak(ex.speakAfter);
  render();
}

function selfGrade(grade) {
  const ex = liveEx;
  if (!ex || ex.type !== 'self' || sess.reveal) return;
  const result = grade > 1 ? 'right' : 'wrong';
  const line = scoreAnswer(ex, result, Date.now() - exStart, grade);
  sess.reveal = { result, line };
  sess.selfOpen = false;
  render();
}

/* ---------- teach cards ---------- */
function teachFooter(kind) {
  const nudge = kind === 'technique'
    ? 'Close your eyes and picture the movement once — imagining it is real practice.'
    : kind === 'concept'
      ? 'Say the main idea back to yourself in your own words before continuing.'
      : 'Say it out loud once before you continue. Producing the sound builds a stronger trace than reading it.';
  return `<div style="margin-top:18px" class="row">
    <button class="btn primary" data-act="learned">Got it — test me</button>
    <span class="faint" style="font-size:12px">${nudge}</span>
  </div>`;
}

        <div style="flex:1">

      ${(item.keyPoints || []).length ? `<div class="tip"><b>Key points</b><ul class="kd">${item.keyPoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}
      ${prov}
      ${teachFooter('concept')}

  }

  // technique
  return `<div class="card teach">
    <div class="q-kind">New technique · ${esc(item.unitTitle)}</div>
    <div style="font-size:21px;font-weight:650">${esc(item.name)}</div>
    <div class="rom"><span class="ko" style="font-size:16px">${esc(item.ko)}</span> · ${esc(item.rom)}</div>
    ${item.purpose ? `<p class="sub" style="margin:10px 0 0;font-size:14px;color:var(--tx)">${esc(item.purpose)}</p>` : ''}
    ${item.attackOrGrab ? `<div class="kv"><b>Against:</b> ${esc(item.attackOrGrab)}</div>` : ''}

    ${mediaSlot(item)}

    ${(item.keyDetails || []).length ? `<div class="tip"><b>Key points</b><ul class="kd">${item.keyDetails.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}

let beltView = null;          // belt being viewed on the Belt tab
let beltScope = 'course';     // 'course' (the active one) | 'all'
let practiceItemId = null;    // item open in the practice-log view
let practiceState = null;     // transient checklist state
let instrUnlocked = false;    // instructor mode session flag (never persisted)

function beltBand(b, lg) {
  return `<span class="beltband${lg ? ' lg' : ''}" style="background:${b.color}">${b.stripe ? `<i style="background:${b.stripe}"></i>` : ''}</span>`;
}
function gupLabel(b) { return b.gup > 0 ? b.gup + (b.gup === 1 ? 'st' : b.gup === 2 ? 'nd' : b.gup === 3 ? 'rd' : 'th') + ' gup' : '1st Dan'; }

function supervisionNotice(item) {
  const partner = item.safetyClass === 'partnerWithCare';
  return `<div class="notice-supervision"><b>${partner ? 'Partner drills — in class' : 'Instructor supervision required'}</b><br>
    ${partner
      ? 'Practice this with a partner at the dojang, at drilling speed, after your instructor introduces it. Tap or “stop” means instant release — both directions.'
      : 'This is learned physically only with your instructor, on mats. The app teaches the name, steps, and safety points so class time goes further — it never replaces the mat.'}
    ${item.practiceRestrictions ? `<br><span class="faint">${esc(item.practiceRestrictions)}</span>` : ''}
  </div>`;
}

function mediaSlot(item) {
  const m = item.media || {};
  const src = m.videoFullSpeed || m.videoFront || m.videoSide || m.videoSlowMotion || null;
  const hear = item.ko ? ` <button class="speak" style="width:30px;height:30px;display:inline-grid;vertical-align:middle" aria-label="Play audio" data-speak="${esc(item.ko)}">${SPEAKER_SVG}</button>` : '';
  const fallback = `<div class="ms-icon" aria-hidden="true">🎬</div>
      <b>Demonstration coming soon</b><br>
      <span class="faint" style="font-size:12.5px">Grandmaster Lee's video will appear here.${item.ko ? ' Hear the Korean name:' : ''}</span>${hear}`;
  if (!src) return `<div class="media-slot">${fallback}</div>`;
  return `<div class="media-slot has">
    <video controls preload="metadata" src="${esc(src)}" onerror="this.closest('.media-slot').classList.add('failed')"></video>
    <div class="ms-fallback">${fallback}</div>
  </div>`;
}

/* ---------- shell + routing ---------- */
function render() {
  const app = document.getElementById('app');
  document.documentElement.classList.toggle('light', S.settings.theme === 'light');
  applyCourseIdentity();
  applyFxSettings();

  // No course picked yet? Then the picker is the app. Nothing to study
  // until a student says which of the two they are here for.
  if (COURSES.length && !activeCourse() && view !== 'courses') view = 'courses';

  if (view === 'session') { app.innerHTML = renderSession(); afterRender(); return; }
  if (view === 'done') { app.innerHTML = shell(renderDone()); afterRender(); return; }

  let body = '';
  if (view === 'today') body = renderPath();
  else if (view === 'courses') body = renderCourses();
  else if (view === 'belt') body = renderBelt();
  else if (view === 'progress') body = renderCourseProgress() + renderProgress();
  else if (view === 'method') body = renderMethod();
  else if (view === 'settings') body = renderSettings();
  else if (view === 'practice') body = renderPractice();
  else if (view === 'instructor') body = renderInstructor();
  else { view = 'today'; body = renderPath(); }
  app.innerHTML = shell(body);
  afterRender();
}

function shell(body) {
  const course = activeCourse();
  const picking = COURSES.length && !course;
  const tabs = [['today', 'Path'], ['belt', 'Belt'], ['progress', 'Progress'], ['method', 'Method'], ['settings', 'Settings']];
  const switcher = course
    ? `<button class="cswitch" data-view="courses" title="Switch course" aria-label="Switch course — currently ${esc(course.nameEnglish)}">
         ${courseMark(course)}<span class="cs-name">${esc(course.shortName)}</span><span class="cs-caret">▾</span>
       </button>`
    : '';
  return `
  <header class="top">
    <div class="brand"><span class="mark ko">합</span><span>Hapkido Companion<br><small>working title · provisional curriculum</small></span></div>
    <div class="spacer"></div>
    ${switcher}
    <button class="iconbtn" data-act="theme" title="Light / dark">${S.settings.theme === 'dark' ? '☀' : '☾'}</button>
  </header>
  ${picking ? '' : `<nav class="tabs">${tabs.map(([k, l]) => `<button data-view="${k}" class="${view === k ? 'on' : ''}">${l}</button>`).join('')}</nav>`}
  ${storageOk ? '' : `<div class="notice" style="margin-bottom:14px">
    <b>This browser will not let the app save.</b> Nothing you study here will survive closing the tab.
    That usually means a private window, or the page is running inside another app. Open <code>index.html</code>
    directly in Chrome, Edge, Firefox or Safari and bookmark it — then progress sticks. Export in Settings still works either way.
  </div>`}
  ${body}`;
}

/* ---------- the course picker — two courses, one belt ---------- */
function courseArt(c) {
  const raster = (window.HKD_COURSE_ART || {})[c.id];
  if (raster) return `<span class="cart"><img src="${esc(raster)}" alt="" loading="lazy"></span>`;
  const emblem = (window.HKD_COURSE_EMBLEM || {})[c.id];   // local, trusted markup
  if (emblem) return `<span class="cart emb" style="color:${c.accent}">${emblem}</span>`;
  return `<span class="cart plain"><span class="cart-glyph ko">${esc(c.glyph || '')}</span></span>`;
}

function courseSummary(c) {
  const st = stats(c);
  const p = plan(c);
  const total = eligibleSequence(c).length;
  const all = SEQUENCE.filter(id => courseIdOf(ITEMS[id]) === c.id).length;
  return { st, p, total, all, due: p.due.length + p.newIds.length,
           frac: total ? st.introduced / total : 0 };
}

function renderCourseCard(c, opts) {
  const o = opts || {};
  const s = courseSummary(c);
  const active = activeCourse() && activeCourse().id === c.id;
  const started = s.st.introduced > 0;
  return `<button class="ccard${active ? ' on' : ''}${o.mini ? ' mini' : ''}" data-course="${c.id}" style="--cacc:${c.accent};--cacd:${c.accentDim}">
    ${courseArt(c)}
    <span class="cbody">
      <span class="ctitle">${esc(c.nameEnglish)}</span>
      <span class="ckor ko">${esc(c.nameKorean)}${S.settings.showRomanization && c.rom ? ` <i>${esc(c.rom)}</i>` : ''}</span>

      <span class="cmeta">
        <span class="chip">${s.all} items</span>

        ${s.due ? `<span class="chip accent">${s.due} due today</span>` : '<span class="chip">all clear today</span>'}

function renderCourses() {
  const course = activeCourse();

      </div>

}

/* ---------- the belt path (home) ---------- */
function unitState(u) {
  const ids = SEQUENCE.filter(id => ITEMS[id].unit === u.id);
  const intro = ids.filter(id => S.introduced[id]).length;
  const held = ids.filter(id => {
    const it = ITEMS[id];
    const c = S.cards[ck(id, ladderFor(it)[0])];
    return c && c.state !== 'new' && (c.S || 0) >= 3;
  }).length;
  const mastered = ids.filter(id => knowledgeMastered(ITEMS[id])).length;
  const techs = ids.filter(id => ITEMS[id].kind === 'technique' && ITEMS[id].instructorRequired);
  const verified = techs.filter(id => S.verifications[id]).length;
  return { ids, intro, held, mastered, done: ids.length > 0 && intro === ids.length && held === ids.length,
           sealed: techs.length > 0 && verified === techs.length, techCount: techs.length, verified };
}

function renderPath() {
  const belt = activeBelt();
  const course = activeCourse();
  const p = plan(course);
  const st = stats(course);
  const rec = dayRec(todayKey());
  const total = p.due.length + p.newIds.length;
  const first = st.introduced === 0;
  const doneToday = rec.reviews;

  const units = courseUnits(course, belt);
  const check = '<svg viewBox="0 0 26 26" style="width:15px;height:15px"><path d="M4 14l6 6L22 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const lock = '<svg class="lockico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  const nodec = belt.stripe || (belt.dark ? belt.color : 'var(--accent)');

  // One lane — this course's. Its own numbering, its own glowing next step.
  const renderLane = laneUnits => {
    const states = laneUnits.map(u => unitState(u));
    let activeIdx = states.findIndex(s => !s.done);
    return laneUnits.map((u, i) => {
      const s = states[i];
      const cls = s.done ? 'done' : i === activeIdx ? 'active' : 'up';
      return `<div class="pnode ${cls}" data-gotounit="${u.id}" style="--nodec:${nodec}">
        <div class="dot">${s.done ? check : (i + 1)}</div>
        <div class="pinfo">
          <div class="pt">${esc(u.title)}${s.sealed ? '<span class="seal" title="All techniques instructor-verified">✓</span>' : ''}</div>
          <div class="ps">${esc(u.blurb)}</div>
          <div class="ps">${s.intro}/${s.ids.length} learned${s.mastered ? ` · ${s.mastered} mastered` : ''}${s.techCount ? ` · ${s.verified}/${s.techCount} verified` : ''}</div>
        </div>
      </div>`;
    }).join('');
  };

  const nextBelts = BELTS.filter(b => b.order > belt.order).map(b => {
    const has = SEQUENCE.some(id => ITEMS[id].beltId === b.id && (!course || courseIdOf(ITEMS[id]) === course.id));
    return `<div class="pnode lockb">
      <div class="dot">${lock}</div>
      <div class="pinfo">
        <div class="pt">${beltBand(b)} ${esc(b.nameEnglish)} <span class="faint" style="font-weight:400;font-size:12px">· ${gupLabel(b)}</span></div>
        <div class="ps">${has ? 'Locked — finish your current belt first' : "Awaiting Grandmaster Lee's curriculum"}</div>
      </div>
    </div>`;
  }).join('');

  const others = otherCourses().filter(c => eligibleSequence(c).length);
  const otherBlock = others.length ? `<div class="card othercourse">
    <h3 style="margin-top:0">Your other course</h3>
    <p class="sub">Waiting exactly where you left it. Studying it costs this one nothing — each course keeps its own daily pace.</p>
    ${others.map(c => renderCourseCard(c, { mini: true })).join('')}
  </div>` : '';

  return `
  ${course ? `<div class="course-banner" style="--cacc:${course.accent};--cacd:${course.accentDim}">
    ${courseMark(course, 30)}
    <div style="flex:1">
      <div class="cb-name">${esc(course.nameEnglish)}</div>
      <div class="cb-sub"><span class="ko">${esc(course.nameKorean)}</span>${S.settings.showRomanization && course.rom ? ` <span class="faint" style="font-family:var(--mono);font-size:11px">${esc(course.rom)}</span>` : ''} · ${esc(course.tagline)}</div>
    </div>
    <button class="btn ghost sm" data-view="courses">Switch</button>
  </div>` : ''}

  <div class="belt-banner" style="--belt:${belt.color}">
    <div class="row" style="gap:14px">
      ${beltBand(belt, true)}
      <div style="flex:1">
        <div class="bb-name">${esc(belt.nameEnglish)} <span class="ko">${esc(belt.nameKorean)}</span>${romFor(belt.nameKorean) ? ` <span class="faint" style="font-size:11.5px;font-family:var(--mono);font-weight:400">${esc(romFor(belt.nameKorean))}</span>` : ''}</div>
        <div class="bb-sub">${gupLabel(belt)} · ${esc(belt.theme)}</div>
      </div>
    </div>
    ${CURRICULUM.meta.approvalStatus !== 'approved' ? `<div class="badge-prov">Provisional — awaiting Grandmaster Lee's approval</div>` : ''}
  </div>

  <div class="card hero" style="margin-top:14px">
    <h2>${first ? (course ? esc(course.firstStep || ('Begin ' + course.nameEnglish)) : 'Begin your journey') : 'Today'}</h2>
    <p class="sub">${first
      ? (course ? esc(course.blurb) + ' ' : '') + `${units.length} short unit${units.length === 1 ? '' : 's'} at ${esc(belt.nameEnglish)}, and none of it is busywork — it is what your instructors expect you to know.`
      : total === 0
        ? 'Nothing is due in this course. That is the schedule working, not a failure — come back tomorrow rather than grinding ahead.'
        : 'Reviews come first, new material is threaded through them.'}</p>
    <div class="plan">
      <span class="chip accent">Due <b>${p.due.length}</b>${p.dueTotal > p.due.length ? ` <span class="faint">of ${p.dueTotal}</span>` : ''}</span>
      <span class="chip good">New <b>${p.newIds.length}</b></span>
      <span class="chip">Target <b>~${S.settings.sessionMinutes} min</b></span>
      ${doneToday ? `<span class="chip">Done today <b>${doneToday}</b> · ${fmtMin(rec.ms)}</span>` : ''}
      ${st.streak ? `<span class="chip">Streak <b>${st.streak}</b> ${st.streak === 1 ? 'day' : 'days'}</span>` : ''}
    </div>
    <button class="btn primary big" data-act="start" ${total === 0 ? 'disabled' : ''}>
      ${total === 0 ? 'All clear for today' : (first ? `Start Unit 1 — ${esc((units[0] || {}).title || 'the first unit')}` : `Train ${total} card${total === 1 ? '' : 's'}`)}
    </button>
    ${(() => {
      const both = planTotal();
      return both > total ? `<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" data-act="start-both">Everything due · both courses <b>${both}</b></button>
        <span class="faint" style="font-size:12px">for the week before a belt test</span>
      </div>` : '';
    })()}
    ${total === 0 && p.remainingInCourse > 0 ? `<div style="margin-top:10px"><button class="btn ghost" data-act="extra">Learn ${Math.min(5, p.remainingInCourse)} extra new items anyway</button></div>` : ''}
  </div>

  <div class="card" style="margin-top:14px">
    <h3 style="margin-top:0">${course ? esc(course.nameEnglish) : 'Your path'} <span class="faint" style="font-weight:400;font-size:12.5px">· ${esc(belt.nameEnglish)}</span></h3>
    <div class="path" data-course="${course ? esc(course.id) : ''}">${renderLane(units) || '<p class="sub">This belt has no units for this course yet.</p>'}</div>
    <h3>The road ahead</h3>
    <div class="path">${nextBelts}</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">${course ? esc(course.shortName) + ' readiness' : 'Belt readiness'} <span class="faint" style="font-weight:400;font-size:12.5px">· ${esc(belt.nameEnglish)}</span></h3>
    ${renderReadiness(belt, course)}
    <p class="sub" style="margin:10px 0 0"><button class="btn ghost sm" data-view="belt">See all five belt measures</button></p>
  </div>

  ${otherBlock}

  ${first ? `<div class="card"><h3 style="margin-top:0">How this app fits your training</h3>
    <div class="prose">
    <p>This is a <em>training companion</em>, not a substitute for the mat. It builds the half of Hapkido that lives in your head — terminology, principles, sequences, safety — with the same retrieval-and-spacing engine serious language learners use, so class time can go to the half that lives in your body.</p>
    <p>Falls, throws, locks and partner work are learned <em>only</em> with your instructors. The app prepares you for them, tracks what has been instructor-verified, and celebrates like crazy when things stick. It never awards rank — Grandmaster Lee does that.</p>
    </div></div>` : ''}
  `;
}

/* The five measures. Course-scoped on the path, whole-belt on the Belt
   tab — where all five always show, because that is the honest picture
   of a rank. A course with no physical requirements simply has no
   physical bars to draw. */
function renderReadiness(belt, courseSel) {
  const course = asCourse(courseSel);
  const bs = beltStats(belt, course);
  const cum = cumulativeStats(belt, course);
  const physical = !course || bs.practicable > 0 || bs.vreq > 0;
  const row = (label, valText, frac) => `<div class="rrow">
    <div class="rl"><span>${label}</span><span>${valText}</span></div>
    <div class="bar"><i class="${frac >= 1 ? 'good' : ''}" style="width:${Math.round(Math.min(1, frac) * 100)}%"></i></div>
  </div>`;
  return `
    ${row('Knowledge retention', bs.retention == null ? '—' : pct(bs.retention), bs.retention || 0)}
    ${row('Curriculum exposure', `${bs.intro}/${bs.total}`, bs.total ? bs.intro / bs.total : 0)}
    ${row('Knowledge mastered', `${bs.mastered}/${bs.total}`, bs.total ? bs.mastered / bs.total : 0)}
    ${physical ? row('Practice logged (solo-safe)', bs.practicable ? `${bs.practiced}/${bs.practicable}` : '—', bs.practicable ? bs.practiced / bs.practicable : 0) : ''}
    ${physical ? row('Instructor verification', bs.vreq ? `${bs.vdone}/${bs.vreq}` : '—', bs.vreq ? bs.vdone / bs.vreq : 0) : ''}
    ${cum.total ? row('Previous belts (cumulative)', `${cum.mastered}/${cum.total} mastered · ${cum.vdone}/${cum.vreq} verified`, cum.total ? cum.mastered / cum.total : 0) : ''}
    <p class="sub" style="margin:10px 0 0">${physical
      ? 'Practice entries are your own honest log. Verification comes only from an instructor, in person.'
      : 'This course is knowledge, so these are knowledge measures. Practice and verification live in the techniques course.'}
      The belt itself comes from Grandmaster Lee — the app only reports preparation.</p>`;
}

/* ---------- per-course numbers above the shared Progress tab ---------- */
function renderCourseProgress() {

    <h2 style="margin-top:0">Course by course</h2>
    <p class="sub">Two courses, measured separately. The forecast, consistency grid and card tables below cover everything you study — one habit, one calendar.</p>
    <div class="cprog">${COURSES.map(c => {
      const s = courseSummary(c);
      const active = activeCourse() && activeCourse().id === c.id;
      return `<button class="cprow${active ? ' on' : ''}" data-course="${c.id}" style="--cacc:${c.accent}">
        ${courseMark(c)}
        <span class="cp-body">
          <span class="cp-t">${esc(c.nameEnglish)}${active ? ' <i class="cp-now">studying</i>' : ''}</span>
          <span class="cp-n">${s.st.introduced}/${s.total} met at ${esc(activeBelt().nameEnglish)} · ${s.st.wordsKnown} holding · ${s.st.mature} mature</span>
          <span class="cbar"><i style="width:${Math.round(Math.min(1, s.frac) * 100)}%"></i></span>

/* ---------- belt tab ---------- */
function renderBelt() {
  const active = activeBelt();
  const viewing = BELT_BY_ID[beltView] || active;
  const preview = viewing.order > active.order;
  const course = beltScope === 'all' ? null : activeCourse();
  const ids = beltItems(viewing.id, true).filter(id => !course || courseIdOf(ITEMS[id]) === course.id);

    ${(it.commonErrors || []).length ? `<div class="tip"><b>Common mistakes to spot</b><ul class="kd">${it.commonErrors.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}

    ${isRestricted(it) ? supervisionNotice(it) : ''}
    ${(it.instructorCheckpoints || []).length ? `<div class="tip"><b>What your instructor checks</b><ul class="kd">${it.instructorCheckpoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}

      : `<div class="kv" style="margin-top:10px"><b>Practice:</b> in class${it.partnerRequired ? ', with a partner' : ''} — ask your instructor to work on this.</div>`}

function pinHash(p) { // deterrent, not cryptography — data lives on this device anyway
  let h = 5381; const s = 'lmaa·' + p;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* ---------- method ---------- */
function renderMethod() {
  return `<div class="card"><h2>Why the app behaves the way it does</h2>
  <div class="prose">
    <p>Nothing here is decorative. Each mechanic exists because the research on learning points the same way — and one boundary exists because the research on martial-arts injuries points the same way too.</p>

    <h4>Two halves, honestly separated</h4>
    <p>Hapkido lives half in your head — names, sequences, principles, safety — and half in your body. This app trains the head half with the best tools that exist for it, and refuses to pretend about the body half. Physical skill is built on the mat and <em>verified only by your instructors</em>. The app's own vocabulary keeps the line sharp: “knowledge mastered” and “ready to practice in class” are app claims; “instructor verified” is a human's.</p>

    <h4>Retrieval, not review</h4>
    <p>Every card asks you to produce something before it shows you anything. Pulling a term or a step sequence out of memory strengthens it far more than re-reading — the best-replicated finding in the field. It is also why the app feels harder than flipping through notes, and why the harder version wins.</p>

    <h4>Spacing on a real forgetting curve</h4>
    <p>Scheduling is <code>FSRS</code>, which tracks stability, difficulty, and current retrievability per card, and brings each one back just as you are about to lose it. The Progress tab shows the model's predicted recall next to your measured retention, so you can see whether it is calibrated for you.</p>

    <h4>Why some techniques are class-only</h4>
    <p>Injury data in throwing arts is worst for beginners in their first year — before falling skill exists. So falls, throws, locks, and partner defenses here teach names, sequences, and safety points, then stop, on purpose. No streak, no stability number, nothing in this app ever unlocks physical practice of a restricted technique. Your instructor does, in person, and the app records that with their initials and the date.</p>

    <h4>Watch like a student, not a viewer</h4>
    <p>When Grandmaster Lee's demonstrations arrive, each one comes with the key points and common mistakes written next to it — research on video learning is blunt that raw footage without expert cues teaches little. Before re-watching an explanation, the app will usually ask you to recall first; and while watching, imagine performing the movement. Watching-while-imagining measurably outperforms just watching.</p>

    <h4>Difficulty is honored, never punished</h4>
    <p>There are no hearts, no lives, no timers, and no penalty for a miss — a wrong answer simply comes back sooner, which is the schedule learning, not you failing. The celebration layer is deliberately one-sided: right answers escalate from sparks to fireworks; misses get a soft tone and a little training partner who looks mildly concerned on your behalf. That partner wears your current belt — as you advance, so do they.</p>

    <h4>A streak that allows rest</h4>
    <p>The streak tolerates two rest days a week by design. A streak you are afraid to lose starts driving the behavior instead of the learning — and rest is part of training. Ask any instructor.</p>

    <h4>Honest numbers, five of them</h4>
    <p>Belt readiness is never one percentage. Retention, exposure, mastery, practice, and verification are different truths, and collapsing them would let a strong memory hide an unverified fall. The bars stay separate so you — and your instructors — can see exactly what kind of ready you are.</p>

    <h4>What you should do outside the app</h4>
    <p>Go to class. Nothing here replaces mats, partners, and eyes that catch what you cannot feel yet. Between classes: run your reviews, do your solo-safe assignments slowly, picture the restricted techniques step by step, and arrive with one good question for your instructor. That combination — knowledge here, skill there — is the whole design.</p>
  </div></div>`;
}

      <small>Helpful at first. As terms stick, try turning it off and trusting your ear.</small></div>

      <div class="ctl"><select data-set="theme"><option value="dark" ${S.settings.theme === 'dark' ? 'selected' : ''}>Dark</option><option value="light" ${S.settings.theme === 'light' ? 'selected' : ''}>Light</option></select></div></div>
  </div>

  <div class="card">

    <p class="sub" style="margin:10px 0 0">Curriculum <b>${esc(S.curriculumVersion)}</b> · ${CURRICULUM.meta.approvalStatus === 'approved' ? 'approved by ' + esc(CURRICULUM.meta.approvedBy || '') : 'provisional — awaiting Grandmaster Lee'}.</p>
    <p class="sub" style="margin:10px 0 0;font-size:12px">This app is a training companion for students of the school. It never awards rank, never certifies physical competence, and is not emergency, medical, legal, or self-defense advice.</p>
